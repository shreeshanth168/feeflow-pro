<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FeeFlow Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="__SUPABASE_URL__">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --primary: #0F172A; --text-secondary: #64748B;
    --border: #E2E8F0; --success: #10B981; --success-bg: #ECFDF5;
    --warning: #F59E0B; --warning-bg: #FFFBEB; --danger: #EF4444; --danger-bg: #FEF2F2;
    --accent: #2563EB; --accent-bg: #EFF6FF;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 4px 12px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-lg: 0 20px 48px rgba(15,23,42,0.12);
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  }
  html[data-theme="dark"] {
    --bg: #0B1120; --surface: #131B2C; --primary: #F1F5F9; --text-secondary: #8B98AC;
    --border: #232E44; --success: #34D399; --success-bg: #0F2A22;
    --warning: #FBBF24; --warning-bg: #2E2308; --danger: #F87171; --danger-bg: #2E1414;
    --accent: #60A5FA; --accent-bg: #12233F;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
    --shadow-lg: 0 20px 48px rgba(0,0,0,0.5);
  }
  body, .card, .navbar, .sidebar, input, select, .kpi-card, .dropdown-panel { transition: background-color .15s, border-color .15s, color .15s; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--primary); -webkit-font-smoothing: antialiased; animation: fadeIn .2s ease; overflow-x: hidden; max-width: 100vw; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  h1,h2,h3,p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent-bg); }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- layout ---------- */
  .page-max { max-width: 1440px; margin: 0 auto; padding: 32px; }
  @media (max-width: 900px) { .page-max { padding: 20px; } }

  /* ---------- typography ---------- */
  .text-page-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .text-section-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .text-secondary { color: var(--text-secondary); font-size: 14px; }
  .text-small { font-size: 13px; color: var(--text-secondary); }
  .text-kpi { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }

  /* ---------- form controls ---------- */
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm);
    font-family: inherit; font-size: 14px; background: var(--surface); color: var(--primary);
    transition: border-color .12s, box-shadow .12s;
  }
  @media (max-width: 600px) {
    input, select { font-size: 16px; } /* iOS zooms the whole page in on focus below 16px — this stops that */
  }
  input::placeholder { color: #94A3B8; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .field { margin-bottom: 16px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid transparent; border-radius: var(--r-sm); padding: 9px 16px;
    font-weight: 500; font-size: 14px; cursor: pointer; font-family: inherit;
    transition: background .12s, border-color .12s, transform .12s; white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #1E293B; }
  .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--primary); }
  .btn-secondary:hover { background: #F1F5F9; }
  .btn-danger { background: var(--surface); border-color: #FCA5A5; color: var(--danger); }
  .btn-danger:hover { background: var(--danger-bg); }
  .btn-ghost { background: transparent; color: var(--text-secondary); }
  .btn-ghost:hover { background: #F1F5F9; color: var(--primary); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  .btn-block { width: 100%; }
  .btn-icon { padding: 8px; }
  @media (max-width: 600px) { .btn-icon { padding: 12px; min-width: 44px; min-height: 44px; } }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-sm); }
  .card-tight { padding: 16px; }

  /* ---------- kpi cards ---------- */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 1000px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 20px; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s; cursor: default;
  }
  .kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .kpi-icon { width: 36px; height: 36px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .kpi-icon svg { width: 18px; height: 18px; }
  .kpi-number { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin-bottom: 6px; }
  .kpi-label { font-size: 14px; font-weight: 500; color: var(--primary); }
  .kpi-trend { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; }

  /* ---------- badges ---------- */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-success { background: var(--success-bg); color: #047857; }
  .badge-success .badge-dot { background: var(--success); }
  .badge-warning { background: var(--warning-bg); color: #B45309; }
  .badge-warning .badge-dot { background: var(--warning); }
  .badge-danger { background: var(--danger-bg); color: #B91C1C; }
  .badge-danger .badge-dot { background: var(--danger); }
  .badge-neutral { background: #F1F5F9; color: var(--text-secondary); }
  .badge-neutral .badge-dot { background: #94A3B8; }

  /* ---------- table ---------- */
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr { transition: background .1s; }
  .data-table tbody tr:hover { background: #F8FAFC; }
  @media (max-width: 640px) { .hide-mobile { display: none; } }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12.5px; flex-shrink: 0; }

  /* ---------- empty state ---------- */
  .empty-state { text-align: center; padding: 64px 24px; }
  .icon-wrap { width: 56px; height: 56px; border-radius: 50%; background: #F1F5F9; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-wrap svg { width: 24px; height: 24px; color: var(--text-secondary); }
  .empty-state .icon-wrap { margin: 0 auto 18px; }
  .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .empty-state p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }

  /* ---------- banners ---------- */
  .banner { border-radius: var(--r-md); padding: 13px 16px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid transparent; }
  .banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
  .banner-warning { background: var(--warning-bg); color: #92400E; border-color: #FDE68A; }
  .banner-danger { background: var(--danger-bg); color: #991B1B; border-color: #FECACA; }
  .banner-success { background: var(--success-bg); color: #065F46; border-color: #A7F3D0; }
  .error-text { color: var(--danger); font-size: 13px; font-weight: 500; margin: 6px 0; }

  code { background: #F1F5F9; padding: 2px 7px; border-radius: 5px; font-size: 12.5px; font-family: 'SF Mono', Consolas, monospace; }

  /* ---------- navbar (centre app) ---------- */
  .navbar { position: sticky; top: 0; z-index: 50; height: 72px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 32px; gap: 32px; }
  @media (max-width: 900px) { .navbar { padding: 0 16px; gap: 16px; } }
  .nav-logo { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .nav-logo .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
  .nav-links { display: flex; align-items: center; gap: 4px; flex: 1; }
  .nav-link { padding: 8px 14px; border-radius: var(--r-sm); font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all .12s; }
  .nav-link:hover { color: var(--primary); background: #F1F5F9; }
  .nav-link.active { color: var(--primary); background: #F1F5F9; }
  @media (max-width: 780px) { .nav-links { display: none; } }
  .theme-toggle { }
  .bottom-tabbar { display: none; }
  @media (max-width: 780px) {
    .bottom-tabbar {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 62px;
      background: var(--surface); border-top: 1px solid var(--border); z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-tabbar .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4B5768; font-size: 10.5px; font-weight: 500; cursor: pointer; }
    .bottom-tabbar .tab-item svg { width: 19px; height: 19px; }
    .bottom-tabbar .tab-item.active { color: var(--accent); }
    .page-max { padding-bottom: 84px; }
  }
  .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .nav-search { position: relative; width: 220px; }
  @media (max-width: 780px) { .nav-search { display: none; } }
  .nav-search input { padding-left: 34px; background: #F8FAFC; }
  .nav-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: #94A3B8; }
  .icon-btn { position: relative; width: 36px; height: 36px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); border: 1px solid transparent; transition: all .12s; background: none; }
  @media (max-width: 600px) { .icon-btn { width: 42px; height: 42px; } }
  .icon-btn:hover { background: #F1F5F9; color: var(--primary); }
  .icon-btn svg { width: 18px; height: 18px; }
  .notif-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 2px solid var(--surface); }
  .dropdown { position: relative; }
  .dropdown-panel { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-lg); min-width: 260px; padding: 8px; z-index: 60; animation: dropIn .12s ease; }
  .dropdown-panel.open { display: block; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .dropdown-item { padding: 9px 12px; border-radius: var(--r-sm); font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 9px; color: var(--primary); }
  .dropdown-item svg { width: 15px; height: 15px; color: var(--text-secondary); }
  .dropdown-item:hover { background: #F1F5F9; }
  .dropdown-header { padding: 10px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .profile-trigger { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 999px; cursor: pointer; border: 1px solid var(--border); }
  .profile-trigger:hover { background: #F8FAFC; }

  /* ---------- quick actions ---------- */
  .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .quick-actions .btn { border-radius: var(--r-md); }

  /* ---------- charts ---------- */
  .bar-chart { display: flex; align-items: flex-end; gap: 14px; height: 160px; padding-top: 10px; }
  .bar-chart .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
  .bar-chart .bar { width: 100%; max-width: 34px; background: var(--accent); border-radius: 5px 5px 0 0; transition: opacity .12s; min-height: 3px; }
  .bar-chart .bar:hover { opacity: 0.8; }
  .bar-chart .bar-label { font-size: 11.5px; color: var(--text-secondary); }
  .pie-wrap { display: flex; align-items: center; gap: 20px; }
  .pie { width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0; }
  .pie-legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; }

  /* ---------- activity timeline ---------- */
  .timeline-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot-wrap { width: 28px; height: 28px; border-radius: 50%; background: #F1F5F9; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .timeline-dot-wrap svg { width: 14px; height: 14px; color: var(--text-secondary); }
  .timeline-text { font-size: 13.5px; font-weight: 500; }
  .timeline-time { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* ---------- login ---------- */
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border-radius: var(--r-lg); padding: 40px 36px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
  @media (max-width: 420px) { .login-card { padding: 28px 22px; } .login-shell { padding: 12px; } }

  /* ---------- id/pass box ---------- */
  .id-pass-box { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: var(--bg); border: 1px dashed var(--border); border-radius: var(--r-md); padding: 16px; }
  @media (max-width: 600px) { .id-pass-box { grid-template-columns: 1fr; } }
  .sub-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 6px; }

  /* ---------- admin shell (sidebar) ---------- */
  .admin-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 248px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
  .sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 6px 8px 20px; font-weight: 700; font-size: 16px; }
  .sidebar-logo .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
  .sidebar-profile { display: flex; align-items: center; gap: 10px; padding: 10px 8px; background: var(--bg); border-radius: var(--r-md); margin-bottom: 18px; }
  .sidebar-profile .name { font-weight: 600; font-size: 13.5px; }
  .sidebar-profile .role { font-size: 11.5px; color: var(--text-secondary); }
  .sidebar-nav-item { padding: 9px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; font-size: 14px; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; color: #3F4C5E; background: transparent; border: 1px solid transparent; transition: all .12s; }
  .sidebar-nav-item svg { width: 17px; height: 17px; stroke-width: 2.25; flex-shrink: 0; }
  .sidebar-nav-item:hover { background: var(--bg); border-color: var(--border); color: var(--primary); }
  .sidebar-nav-item.active { background: var(--primary); color: #FFFFFF; border-color: var(--primary); }
  .sidebar-nav-item.active svg { stroke: #FFFFFF; }
  @media (max-width: 800px) { .sidebar-nav-item { background: var(--bg); border-color: var(--border); margin-bottom: 8px; justify-content: center; padding: 10px; } .sidebar-nav-item.active { background: var(--primary); } }
  .sidebar-bottom { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
  .admin-main { flex: 1; min-width: 0; }
  .sidebar .dropdown { width: 100%; }
  .sidebar .dropdown-panel { left: calc(100% + 8px); right: auto; top: auto; bottom: 0; }
  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 80; }
  .sidebar-backdrop.open { display: block; }
  @media (max-width: 780px) {
    .centre-shell .sidebar { position: fixed; left: -100%; top: 0; width: 240px; height: 100vh; z-index: 90; transition: left .18s ease; box-shadow: var(--shadow-lg); }
    .centre-shell .sidebar.open { left: 0; }
    .centre-shell .sidebar .sidebar-logo span:last-child, .centre-shell .sidebar .sidebar-profile .name, .centre-shell .sidebar .sidebar-profile .role, .centre-shell .sidebar .sidebar-nav-item span { display: inline !important; }
    .centre-shell .sidebar .sidebar-profile, .centre-shell .sidebar .sidebar-nav-item { justify-content: flex-start; }
    .centre-mobile-bar { display: flex !important; }
  }
  @media (min-width: 781px) { .centre-mobile-bar { display: none !important; } }
  .centre-mobile-bar { }
  @media (max-width: 800px) { .sidebar { width: 72px; } .sidebar-logo span:last-child, .sidebar-profile .name, .sidebar-profile .role, .sidebar-nav-item span { display: none; } .sidebar-profile { justify-content: center; } .sidebar-nav-item { justify-content: center; } }
  @media (max-width: 560px) {
    .sidebar { position: fixed; left: -100%; top: 0; width: 240px; z-index: 90; transition: left .18s ease; box-shadow: var(--shadow-lg); }
    .sidebar.open { left: 0; }
    .sidebar .sidebar-logo span:last-child, .sidebar .sidebar-profile .name, .sidebar .sidebar-profile .role, .sidebar .sidebar-nav-item span { display: inline !important; }
    .sidebar .sidebar-profile { justify-content: flex-start; }
    .sidebar .sidebar-nav-item { justify-content: flex-start; }
    .admin-mobile-bar { display: flex !important; }
  }
  .admin-mobile-bar { display: none; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 60; }

  /* ---------- print ---------- */
  @media print {
    body * { visibility: hidden; }
    #printable-receipt, #printable-receipt * { visibility: visible; }
    #printable-receipt { position: fixed; top: 0; left: 0; width: 100%; }
    .no-print { display: none !important; }
  }
  .receipt-dashed { border-top: 1px dashed var(--border); margin: 14px 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>

// =====================================================================
// SUPABASE CONFIG — paste your own project's values here.
// Find both under: Supabase dashboard -> Project Settings -> API
// =====================================================================
const SUPABASE_URL = '__SUPABASE_URL__';
const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

function isConfigured() {
  return SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
}
let sb = null;
function db() {
  if (!sb) {
    if (!isConfigured()) throw new Error('Supabase is not configured yet.');
    if (!window.supabase) throw new Error('Still loading — please wait a moment and try again.');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return sb;
}
function genUUID() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

const ICON_PATHS = {
  'alert-circle': '<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16.01"/>',
  'alert-triangle': '<path d="M12 3 22 20 2 20Z"/><line x1="12" y1="9" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17.01"/>',
  'bell': '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  'check': '<polyline points="20 6 9 17 4 12"/>',
  'download': '<path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/>',
  'eye': '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',

function svgIcon(name, extra) {
  if (name === 'indian-rupee') {
    return `<svg viewBox="0 0 24 24" width="1em" height="1em" style="display:inline-block; vertical-align:-0.15em;" ${extra||''}><text x="12" y="18" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor" font-family="Inter,sans-serif">₹</text></svg>`;
  }
  const body = ICON_PATHS[name];
  if (!body) return '<svg viewBox="0 0 24 24" width="1em" height="1em"></svg>';
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra||''}>${body}</svg>`;
}
function ic() { /* no-op: icons now render inline via svgIcon(), no post-render pass needed */ }

function uid() { return Math.random().toString(36).slice(2, 10); }
function initials(name) { return (name||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n) { return '₹' + Number(n||0).toLocaleString('en-IN'); }
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs/24);
  if (days < 30) return days + 'd ago';
  return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}
function waLink(phone, studentName, amount, dueDay) {
  let digits = (phone || '').replace(/\D/g,'');
  if (digits.length === 10) digits = '91' + digits;
  const msg = `Hi! This is a reminder that ${studentName}'s tuition fee of Rs. ${amount} was due on the ${dueDay}th of this month. Please pay at your earliest convenience. Thank you!`;
  return `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`;
}
async function copyText(text, btn) {
  await navigator.clipboard.writeText(text);
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = original; }, 1200);
}

async function loadThemePref() { try { return localStorage.getItem('feeflow_theme') || 'light'; } catch { return 'light'; } }
async function saveThemePref(theme) { try { localStorage.setItem('feeflow_theme', theme); } catch {} }
async function applyThemePref() {
  const theme = await loadThemePref();
  document.documentElement.setAttribute('data-theme', theme);
}
async function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  await saveThemePref(next);
}

// ---------- data layer (Supabase) ----------
// In-memory cache so repeated reads within a session (which happen on nearly
// every click) don't re-fetch from the database each time. Only save/delete
// calls invalidate/update it.
const CACHE = {};

async function loadCentres() {
  if (CACHE.centres) return CACHE.centres;
  const { data, error } = await db().from('centres').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return []; }
  CACHE.centres = data;
  return data;
}
async function saveCentres(list) {
  CACHE.centres = list;
  const { error } = await db().from('centres').upsert(list);
  if (error) throw error;
}
async function deleteCentre(id) {
  const { error } = await db().from('centres').delete().eq('id', id);
  if (error) throw error;
  delete CACHE.centres;
  delete CACHE['students:' + id]; delete CACHE['payments:' + id]; delete CACHE['activity:' + id];
}

async function loadStudents(centreId) {
  const key = 'students:' + centreId;
  if (CACHE[key]) return CACHE[key];
  const { data, error } = await db().from('students').select('*').eq('centre_id', centreId).order('student_name');
  if (error) { console.error(error); return []; }
  CACHE[key] = data;
  return data;
}
async function saveStudents(centreId, list) {
  const rows = list.map(s => ({ ...s, centre_id: centreId }));
  const { error } = await db().from('students').upsert(rows);
  if (error) throw error;
  CACHE['students:' + centreId] = list;
}

// Payments keep their existing camelCase shape (studentId/amountPaid/paidAt)
// everywhere else in the app — the mapping to/from the DB's snake_case
// columns happens right here, so nothing else in the app had to change.
async function loadPayments(centreId) {
  const key = 'payments:' + centreId;
  if (CACHE[key]) return CACHE[key];
  const { data, error } = await db().from('payments').select('*').eq('centre_id', centreId);
  if (error) { console.error(error); return []; }
  const mapped = (data || []).map(p => ({ id: p.id, studentId: p.student_id, month: p.month, year: p.year, amountPaid: Number(p.amount_paid), paidAt: p.paid_at }));
  CACHE[key] = mapped;
  return mapped;
}
async function savePayments(centreId, list) {
  const rows = list.map(p => ({ id: p.id, centre_id: centreId, student_id: p.studentId, month: p.month, year: p.year, amount_paid: p.amountPaid, paid_at: p.paidAt }));
  const { error } = await db().from('payments').upsert(rows);
  if (error) throw error;
  CACHE['payments:' + centreId] = list;
}

async function loadActivity(centreId) {
  const key = 'activity:' + centreId;
  if (CACHE[key]) return CACHE[key];
  const { data, error } = await db().from('activity_log').select('*').eq('centre_id', centreId).order('at', { ascending: true });
  if (error) { console.error(error); return []; }
  CACHE[key] = data;
  return data;
}
async function saveActivity(centreId, list) {
  const trimmed = list.slice(-40);
  const rows = trimmed.map(a => ({ ...a, centre_id: centreId }));
  const { error } = await db().from('activity_log').upsert(rows);
  if (error) throw error;
  CACHE['activity:' + centreId] = trimmed;
}

async function loadAdminAuth() {
  if (CACHE.admin_auth) return CACHE.admin_auth;
  const { data: { user } } = await db().auth.getUser();
  const { data, error } = await db().from('admin_users').select('user_id, name').eq('user_id', user.id).single();
  if (error) { console.error(error); return { name: 'Platform Admin' }; }
  CACHE.admin_auth = data;
  return data;
}
async function saveAdminName(name) {
  const { data: { user } } = await db().auth.getUser();
  const { error } = await db().from('admin_users').update({ name }).eq('user_id', user.id);
  if (error) throw error;
  delete CACHE.admin_auth;
}
async function logActivity(centreId, type, text) {

  list.push({ id: genUUID(), type, text, at: new Date().toISOString() });
  await saveActivity(centreId, list);

function computeStatus(centre) {
  if (centre.subscription_status === 'paused') return 'paused';
  if (centre.manual_lock) return 'locked';
  const end = new Date(centre.subscription_end_date);
  const now = new Date();
  if (now <= end) return 'active';
  const graceEnd = new Date(end); graceEnd.setDate(graceEnd.getDate() + 7);
  return now <= graceEnd ? 'expired' : 'locked';
}
function canWrite(status) { return status === 'active' || status === 'expired'; }

  banner.style.cssText = 'position:fixed; bottom:16px; left:16px; right:16px; max-width:420px; margin:0 auto; background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; padding:12px 16px; border-radius:10px; font-family:Inter,sans-serif; font-size:13.5px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,0.15);';
  banner.textContent = 'Something failed: ' + msg;
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 8000);
});

function viewLogin() {

      <button class="btn btn-primary btn-block" id="li-btn" style="margin-top:6px; padding:11px;">Sign in</button>
      <p class="text-small" style="margin-top:18px; text-align:center;">Don't have a login? Ask FeeFlow Pro to set up your centre.</p>
    </div>
  </div>`;
}
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(
      `${label} took too long to respond. This usually means a network/firewall block, or your Supabase project is paused — check the Supabase dashboard, and try disabling any ad-blocker or VPN.`
    )), ms))
  ]);
}

function loginIdToEmail(loginId) {
  return loginId.toLowerCase().replace(/[^a-z0-9]/g, '') + '@accounts.feeflowpro.app';
}

async function resolveSessionRole() {
  // After a real Supabase Auth sign-in, figure out whether this person is
  // the admin or a specific centre -- both are just auth users now, RLS
  // makes sure each can only ever see their own "am I this?" row.
  const { data: { user } } = await db().auth.getUser();
  if (!user) return null;
  const [{ data: adminRow }, { data: centreRow }] = await Promise.all([
    db().from('admin_users').select('name').eq('user_id', user.id).maybeSingle(),
    db().from('centres').select('id, centre_name, must_reset_password').eq('auth_user_id', user.id).maybeSingle(),
  ]);
  if (adminRow) return { type: 'admin', name: adminRow.name };
  if (centreRow) return { type: 'centre', centreId: centreRow.id, mustResetPassword: centreRow.must_reset_password };
  return null;
}

function bindLogin() {
  const btn = document.getElementById('li-btn');
  if (!btn) return;
  const doLogin = async () => {
    const id = document.getElementById('li-id').value.trim();
    const pw = document.getElementById('li-pw').value;
    if (!id || !pw) { state.loginErr = 'Enter both your login ID and password.'; render(); return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const { error: authError } = await withTimeout(
        db().auth.signInWithPassword({ email: loginIdToEmail(id), password: pw }), 10000, 'Supabase'
      );
      if (authError) { state.loginErr = "That login ID or password isn't right."; render(); return; }

      const role = await resolveSessionRole();
      if (!role) { state.loginErr = 'Signed in, but no account is linked to this login. Contact FeeFlow Pro.'; render(); return; }

      if (role.type === 'admin') {
        state.session = { type: 'admin' }; state.loginErr = ''; state.view = 'admin'; state.adminView = 'dashboard';
        render(); return;
      }
      state.loginErr = '';
      state.session = { type: 'centre', centreId: role.centreId };
      state.view = role.mustResetPassword ? 'force_reset' : 'centre';
      state.centreView = 'dashboard';
      render();
    } catch (err) {
      console.error(err);
      state.loginErr = err.message || 'Could not reach the database.';
      render();
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
  btn.onclick = doLogin;
  document.getElementById('li-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

function viewForceReset() {
  return `
  <div class="login-shell">
    <div class="login-card">
      <div class="nav-logo" style="margin-bottom:8px;"><span class="dot"></span>FeeFlow Pro</div>
      <h2 class="text-section-title" style="margin-bottom:6px;">Set your password</h2>
      <p class="text-secondary" style="margin-bottom:24px;">This is your first time signing in. Choose a new password before continuing.</p>
      <div class="field"><label>New password</label><input id="fr-pw1" type="password" placeholder="At least 6 characters" /></div>
      <div class="field"><label>Confirm new password</label><input id="fr-pw2" type="password" /></div>
      <div id="fr-err" class="error-text"></div>
      <button class="btn btn-primary btn-block" id="fr-btn" style="padding:11px;">Set password and continue</button>
    </div>
  </div>`;
}
function bindForceReset() {
  document.getElementById('fr-btn').onclick = async () => {
    const p1 = document.getElementById('fr-pw1').value;
    const p2 = document.getElementById('fr-pw2').value;
    const errEl = document.getElementById('fr-err');
    if (p1.length < 6) { errEl.textContent = 'Password should be at least 6 characters.'; return; }
    if (p1 !== p2) { errEl.textContent = "Passwords don't match."; return; }
    const { error: pwError } = await db().auth.updateUser({ password: p1 });
    if (pwError) { errEl.textContent = pwError.message; return; }
    const { error: flagError } = await db().rpc('clear_my_reset_flag');
    if (flagError) { errEl.textContent = flagError.message; return; }
    state.view = 'centre'; state.centreView = 'dashboard';
    render();
  };
}

async function signOut() {
  await db().auth.signOut();
  for (const k in CACHE) delete CACHE[k];
  state.session = null; state.view = 'login'; state.loginErr='';
  state.lastCreatedCentre = null; state.adminSearch=''; state.editingCentreId = null; state.adminView = 'dashboard';
  state.centreView = 'dashboard'; state.showNotif = false; state.showProfile = false;
  render();
}

// =====================================================================
async function renderCentreShell() {
  if (!state.session || state.session.type !== 'centre') { state.view = 'login'; render(); return; }
  const centres = await loadCentres();
  const centre = centres.find(c => c.id === state.session.centreId);
  if (!centre) { signOut(); return; }
  const status = computeStatus(centre);
  const writable = canWrite(status);
  const students = await loadStudents(centre.id);
  const activeStudents = students.filter(s => s.is_active);
  const payments = await loadPayments(centre.id);
  const now = new Date();
  const m = now.getMonth()+1, y = now.getFullYear();

  const rows = activeStudents.map(s => {
    const payment = payments.find(p => p.studentId === s.id && p.month === m && p.year === y);
    let rowStatus = 'pending';
    if (payment) rowStatus = 'paid';

function statusBanner(status) {
  if (status === 'expired') return `<div class="banner banner-warning" style="margin-bottom:24px;">${svgIcon('alert-triangle')}<div>Your subscription has expired. You're in a grace period — renew soon to avoid interruption.</div></div>`;
  if (status === 'locked') return `<div class="banner banner-danger" style="margin-bottom:24px;">${svgIcon('lock')}<div>Your subscription is locked. You can view records, but adding students or marking fees paid is paused until you renew.</div></div>`;
  return '';
}

function backupReminderBanner(centreId) {
  const last = getLastExport(centreId);
  const days = daysSince(last);
  if (days !== null && days < 7) return ''; // backed up recently, stay quiet
  const message = last
    ? `It's been ${days} days since your last local backup.`
    : "You haven't downloaded a local backup yet.";
  return `<div class="banner banner-warning" style="margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
    <div style="display:flex; gap:10px; align-items:flex-start;">${svgIcon('download')}<div>${message} Keeping a copy on your own device protects you if anything ever goes wrong with the database.</div></div>
    <button class="btn btn-secondary btn-sm no-print" id="backup-reminder-btn" style="flex-shrink:0;">Go to Settings</button>
  </div>`;
}

function kpiCard(icon, color, bg, num, label, trend) {
  return `
  <div class="kpi-card">
    <div class="kpi-icon" style="background:${bg}; color:${color};">${svgIcon(icon)}</div>
    <div class="kpi-number">${num}</div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-trend">${trend}</div>
  </div>`;
}
function activityIcon(type) {
  if (type === 'payment') return 'hand-coins';
  if (type === 'receipt') return 'receipt';
  if (type === 'reminder') return 'send';
  if (type === 'student') return 'user-plus';
  return 'activity';
}
function exportReportCsv(centre, rows) {
  const header = 'Student,Parent,Batch,Monthly Fee,Status,Due Day\n';
  const lines = rows.map(r => [r.student.student_name, r.student.parent_name||'', r.student.batch||'', r.student.monthly_fee, r.status, r.student.fee_due_day].join(','));
  const blob = new Blob([header + lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${centre.centre_name.replace(/\s+/g,'-')}-report-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- local backup / data export ----------
// Downloads a complete snapshot (all students, all-time payment history,
// recent activity) as a file the centre keeps on their own device — a
// safety net independent of Supabase, in case of accidental deletion or
// account issues on the database side.
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function exportFullBackupJson(centre) {
  const students = await loadStudents(centre.id);
  const payments = await loadPayments(centre.id);
  const activity = await loadActivity(centre.id);
  const backup = {
    exported_at: new Date().toISOString(),
    centre: { centre_name: centre.centre_name, owner_name: centre.owner_name, owner_phone: centre.owner_phone, plan: centre.plan },
    students, payments, activity,
  };
  downloadBlob(
    JSON.stringify(backup, null, 2),
    `${centre.centre_name.replace(/\s+/g,'-')}-backup-${new Date().toISOString().slice(0,10)}.json`,
    'application/json'
  );
  markExported(centre.id);
}

async function exportPaymentsHistoryCsv(centre) {
  const students = await loadStudents(centre.id);
  const payments = await loadPayments(centre.id);
  const studentById = Object.fromEntries(students.map(s => [s.id, s]));
  const header = 'Student,Month,Year,Amount Paid,Paid At\n';
  const lines = payments.map(p => {
    const s = studentById[p.studentId];
    return [s ? s.student_name : '(deleted student)', p.month, p.year, p.amountPaid, p.paidAt].join(',');
  });
  downloadBlob(
    header + lines.join('\n'),
    `${centre.centre_name.replace(/\s+/g,'-')}-payment-history-${new Date().toISOString().slice(0,10)}.csv`,
    'text/csv'
  );
  markExported(centre.id);
}

// Last-export timestamp lives in this browser only (not shared data) —
// used purely to nudge with a friendly reminder, not enforced anywhere.
function markExported(centreId) {
  try { localStorage.setItem('feeflow_last_export_' + centreId, new Date().toISOString()); } catch {}
}
function getLastExport(centreId) {
  try { return localStorage.getItem('feeflow_last_export_' + centreId); } catch { return null; }
}
function daysSince(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

      const saveBtn = document.getElementById('es-save');
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

// --- Reports page ---
async function renderCentreReportsPage(centre, payments, rows) {
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const total = payments.filter(p => p.month === d.getMonth()+1 && p.year === d.getFullYear()).reduce((s,p)=>s+p.amountPaid,0);
    months.push({ label: d.toLocaleString('en-IN',{month:'short', year:'2-digit'}), total });
  }
  const maxRev = Math.max(...months.map(m=>m.total), 1);
  const thisMonthRevenue = months[months.length-1].total;
  const paid = rows.filter(r=>r.status==='paid').length;
  const pending = rows.filter(r=>r.status==='pending').length;
  const overdue = rows.filter(r=>r.status==='overdue').length;

  document.getElementById('centre-content').innerHTML = `
    <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 class="text-page-title">Reports</h1>
      <button class="btn btn-secondary" id="export-btn">${svgIcon('download')}Export Report</button>
    </div>

    <div class="kpi-grid" style="margin-bottom:28px;">
      ${kpiCard('indian-rupee', 'var(--accent)', 'var(--accent-bg)', money(thisMonthRevenue), 'This month revenue', now.toLocaleString('en-IN',{month:'long'}))}
      ${kpiCard('users', 'var(--success)', 'var(--success-bg)', paid, 'Paid', 'students this month')}
      ${kpiCard('clock', 'var(--warning)', 'var(--warning-bg)', pending, 'Pending', 'students this month')}
      ${kpiCard('alert-circle', 'var(--danger)', 'var(--danger-bg)', overdue, 'Overdue', 'students this month')}
    </div>

    <div class="card">
      <div class="text-section-title" style="margin-bottom:4px;">Monthly collections</div>
      <p class="text-small" style="margin-bottom:8px;">Last 6 months</p>
      <div class="bar-chart">
        ${months.map(mo => `
          <div class="bar-col">
            <div class="text-small" style="font-size:11px;">${mo.total ? '₹'+Math.round(mo.total/1000)+'k' : ''}</div>
            <div class="bar" style="height:${Math.max((mo.total/maxRev)*100,2)}%;"></div>
            <div class="bar-label">${mo.label}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  ic();
  document.getElementById('export-btn').onclick = () => exportReportCsv(centre, rows);
}

function lastExportText(iso) {
  if (!iso) return "You haven't exported a backup yet.";
  const days = daysSince(iso);
  if (days === 0) return 'Last backup: today.';
  if (days === 1) return 'Last backup: yesterday.';
  return `Last backup: ${days} days ago.`;
}

  const adminThemeToggle = document.getElementById('admin-theme-toggle');
  const isDarkNow = document.documentElement.getAttribute('data-theme') === 'dark';
  adminThemeToggle.innerHTML = `${svgIcon(isDarkNow ? 'sun' : 'moon')}<span>${isDarkNow ? 'Light mode' : 'Dark mode'}</span>`;

      <input id="admin-search" placeholder="Search by centre, owner, or login ID…" value="${esc(state.adminSearch)}" />

        <tbody id="centre-tbody">
          ${centres.filter(c => `${c.centre_name} ${c.owner_name} ${c.login_id}`.toLowerCase().includes(state.adminSearch.toLowerCase()))

function centreRowHtml(c) {
  const status = computeStatus(c);
  const badgeMap = { active: 'badge-success', expired: 'badge-warning', locked: 'badge-danger', paused: 'badge-neutral' };
  return `
  <tr>
    <td><div class="avatar">${initials(c.centre_name)}</div></td>
    <td>
      <div style="font-weight:500;">${esc(c.centre_name)}</div>
      <div class="text-small">${esc(c.owner_name)}</div>
    </td>
    <td class="text-secondary hide-mobile" style="text-transform:capitalize;">${c.plan}</td>
    <td class="hide-mobile"><code>${esc(c.login_id)}</code></td>
    <td><span class="badge ${badgeMap[status]}"><span class="badge-dot"></span>${status}</span></td>
    <td>
      <div style="display:flex; gap:6px; justify-content:flex-end;">
        ${status === 'locked' ? `<button class="btn btn-ghost btn-sm btn-icon" data-unlock="${c.id}" title="Unlock">${svgIcon('lock-open')}</button>` : `<button class="btn btn-ghost btn-sm btn-icon" data-lock="${c.id}" title="Lock">${svgIcon('lock')}</button>`}
        <button class="btn btn-ghost btn-sm btn-icon" data-manage="${c.id}" title="Manage">${svgIcon('settings-2')}</button>
      </div>
    </td>
  </tr>`;
}

function bindCentreRowActions(centres) {
  document.querySelectorAll('[data-lock]').forEach(el => el.onclick = async () => {
    const id = el.getAttribute('data-lock');
    const list = await loadCentres();
    const c = list.find(x => x.id === id);
    if (!confirm(`Lock "${c.centre_name}"? They'll be able to view records but not add students or mark fees paid.`)) return;
    c.manual_lock = true;
    try {
      await saveCentres(list);
      renderAdminDashboardView();
    } catch (err) {
      delete CACHE.centres;
      alert('Could not lock this centre: ' + (err.message || 'unknown error'));
      renderAdminDashboardView();
    }
  });
  document.querySelectorAll('[data-unlock]').forEach(el => el.onclick = async () => {
    const id = el.getAttribute('data-unlock');
    const list = await loadCentres();
    const c = list.find(x => x.id === id);
    c.manual_lock = false;
    try {
      await saveCentres(list);
    } catch (err) {
      delete CACHE.centres;
      alert('Could not unlock this centre: ' + (err.message || 'unknown error'));
      renderAdminDashboardView();
      return;
    }
    if (new Date() > new Date(c.subscription_end_date)) {
      alert(`Unlocked. Note: their subscription end date (${c.subscription_end_date}) has already passed — set a new date in Manage to keep them active.`);
    }
    renderAdminDashboardView();
  });
  document.querySelectorAll('[data-manage]').forEach(el => el.onclick = () => openManageModal(el.getAttribute('data-manage'), centres));
}

function openManageModal(id, centres) {
  const c = centres.find(x => x.id === id);
  const status = computeStatus(c);
  const root = document.body;
  const overlay = document.createElement('div');
  overlay.id = 'admin-modal-overlay';
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(15,23,42,0.4); display:flex; align-items:center; justify-content:center; z-index:100;';
  overlay.innerHTML = `
    <div class="card" style="width:100%; max-width:520px; margin:16px; max-height:85vh; overflow-y:auto;">
      <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <div class="text-section-title">Manage ${esc(c.centre_name)}</div>
        <button class="btn btn-ghost btn-icon" id="admin-modal-close">${svgIcon('x')}</button>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;" class="manage-grid">
        <div class="field"><label>Centre name</label><input id="m-name" value="${esc(c.centre_name)}" /></div>
        <div class="field"><label>Owner name</label><input id="m-owner" value="${esc(c.owner_name)}" /></div>
        <div class="field"><label>Owner phone</label><input id="m-phone" type="tel" inputmode="numeric" value="${esc(c.owner_phone||'')}" /></div>
        <div class="field"><label>Plan</label>
          <select id="m-plan">
            <option value="starter" ${c.plan==='starter'?'selected':''}>Starter</option>
            <option value="standard" ${c.plan==='standard'?'selected':''}>Standard</option>
            <option value="premium" ${c.plan==='premium'?'selected':''}>Premium</option>
          </select>
        </div>
        <div class="field"><label>Login ID (fixed)</label><input id="m-loginid" value="${esc(c.login_id)}" disabled style="opacity:0.6;" /></div>
        <div class="field"><label>Subscription end date</label><input id="m-end" type="date" value="${c.subscription_end_date}" /></div>
      </div>
      <p class="text-small" style="margin-top:-8px; margin-bottom:14px;">Login ID can't be changed here — it's tied to their actual sign-in email. To fix a typo, delete and recreate the centre instead.</p>
      <div id="m-err" class="error-text"></div>
      <div style="display:flex; gap:8px; margin-bottom:18px;">
        <button class="btn btn-primary btn-sm" id="m-save">Save changes</button>
        <button class="btn btn-secondary btn-sm" id="m-resetpw">Reset password</button>
        ${status !== 'paused' ? `<button class="btn btn-secondary btn-sm" id="m-pause">Pause account</button>` : `<button class="btn btn-secondary btn-sm" id="m-unpause">Unpause</button>`}
      </div>
      <div id="m-pw-result"></div>
      <div style="border-top:1px solid var(--border); padding-top:16px;">
        <button class="btn btn-danger btn-sm" id="m-delete">${svgIcon('trash-2')}Delete centre</button>
      </div>
      <style>@media (max-width:600px){.manage-grid{grid-template-columns:1fr !important;}}</style>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('admin-modal-close').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  document.getElementById('m-save').onclick = async () => {
    const errEl = document.getElementById('m-err');
    errEl.textContent = '';
    const list = await loadCentres();
    const target = list.find(x => x.id === id);
    target.centre_name = document.getElementById('m-name').value.trim() || target.centre_name;
    target.owner_name = document.getElementById('m-owner').value.trim() || target.owner_name;
    target.owner_phone = document.getElementById('m-phone').value.trim();
    target.plan = document.getElementById('m-plan').value;
    target.subscription_end_date = document.getElementById('m-end').value;
    const saveBtn = document.getElementById('m-save');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      await saveCentres(list);
      overlay.remove();
      renderAdminDashboardView();
    } catch (err) {
      delete CACHE.centres;
      errEl.textContent = err.message || 'Could not save changes.';
      saveBtn.disabled = false; saveBtn.textContent = 'Save changes';
    }
  };
  document.getElementById('m-resetpw').onclick = async () => {
    const newPw = prompt(`Set a new password for ${c.centre_name}:`);
    if (!newPw) return;
    const { data, error } = await db().functions.invoke('admin-reset-password', {
      body: { centre_id: id, new_password: newPw },
    });
    if (error || (data && data.error)) { alert((data && data.error) || error.message); return; }
    delete CACHE.centres;
    document.getElementById('m-pw-result').innerHTML = `<div class="banner banner-success" style="margin-bottom:16px;">${svgIcon('check')}New password: <code>${esc(newPw)}</code> <button class="btn btn-secondary btn-sm" id="m-copy-pw" style="margin-left:6px;">Copy</button></div>`;
    document.getElementById('m-copy-pw').onclick = (e) => copyText(newPw, e.target);
  };
  const pauseBtn = document.getElementById('m-pause');
  if (pauseBtn) pauseBtn.onclick = async () => {
    const list = await loadCentres();
    list.find(x=>x.id===id).subscription_status = 'paused';
    try {
      await saveCentres(list); overlay.remove(); renderAdminDashboardView();
    } catch (err) {
      delete CACHE.centres;
      alert('Could not pause this centre: ' + (err.message || 'unknown error'));
    }
  };
  const unpauseBtn = document.getElementById('m-unpause');
  if (unpauseBtn) unpauseBtn.onclick = async () => {
    const list = await loadCentres();
    list.find(x=>x.id===id).subscription_status = 'active';
    try {
      await saveCentres(list); overlay.remove(); renderAdminDashboardView();
    } catch (err) {
      delete CACHE.centres;
      alert('Could not unpause this centre: ' + (err.message || 'unknown error'));
    }
  };
  document.getElementById('m-delete').onclick = async () => {
    if (!confirm(`Delete "${c.centre_name}" permanently? This removes their login, students, and fee history. This cannot be undone.`)) return;
    try {
      await deleteCentre(id);
      overlay.remove();
      renderAdminDashboardView();
    } catch (err) {
      alert('Could not delete this centre: ' + (err.message || 'unknown error'));
    }
  };
}

async function boot() {
  await applyThemePref();
  const { data: { session } } = await db().auth.getSession();
  if (session) {
    const role = await resolveSessionRole();
    if (role && role.type === 'admin') {
      state.session = { type: 'admin' }; state.view = 'admin'; state.adminView = 'dashboard';
    } else if (role && role.type === 'centre') {
      state.session = { type: 'centre', centreId: role.centreId };
      state.view = role.mustResetPassword ? 'force_reset' : 'centre';
      state.centreView = 'dashboard';
    }
  }
  render();
}

function waitForSupabaseLib(timeoutMs) {
  return new Promise((resolve, reject) => {
    if (window.supabase) return resolve();
    const start = Date.now();
    const iv = setInterval(() => {
      if (window.supabase) { clearInterval(iv); resolve(); }
      else if (Date.now() - start > timeoutMs) { clearInterval(iv); reject(new Error('Supabase library failed to load.')); }
    }, 30);
  });
}

if (!isConfigured()) {
  renderConfigNeeded();
} else {
  waitForSupabaseLib(8000).then(boot).catch(showFatalError);
}
